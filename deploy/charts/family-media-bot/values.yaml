# Workload defaults. Deployment inputs live in deploy/values/prod.yaml.
image:
  # Full Artifact Registry repository path, without a tag.
  repository: ""
  # Deliberately empty: CI supplies the tag at upgrade time so a release is
  # always traceable to a commit. A committed tag drifts from what is deployed.
  tag: ""
  pullPolicy: IfNotPresent

app:
  name: family-media-bot
  telegramSecretName: telegram-bot-token
  workerConcurrency: 1
  logLevel: INFO
  logFormat: json
  adapters:
    queue: pubsub
    storage: gcs
    story: vertex
    image: vertex

serviceAccount:
  annotations: {}

web:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

worker:
  # One warm worker, deliberately. Scaling from zero on Pub/Sub backlog measured
  # ~4m43s of activation latency: the backlog metric samples on a ~60s interval
  # and can gap for minutes. For a bot a child is waiting on, that delay is the
  # whole user experience. Scale-to-zero belongs on a workload with real idle
  # periods and nobody waiting for the first request.
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
