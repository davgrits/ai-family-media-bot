apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "family-media-bot.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "family-media-bot.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
