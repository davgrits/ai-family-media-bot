apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "family-media-bot.name" . }}-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "family-media-bot.labels" . | nindent 4 }}
data:
  # The registry is a chart data file rather than a value: it is reviewed as YAML
  # in a pull request, and .Files keeps it inside the chart so installing from a
  # packaged tarball still works.
  #
  # A ConfigMap caps at ~1 MiB (the etcd value limit). Six characters is ~4 KB, so
  # there is no runtime guard — but a registry approaching that size would need a
  # different delivery mechanism entirely.
  #
  # `indent 4` and not `nindent`: every line of a block scalar needs indenting,
  # and nindent only prefixes the first.
  characters.yaml: |
{{ .Files.Get "files/characters.yaml" | indent 4 }}
