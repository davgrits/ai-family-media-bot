# `helm test` hook. Runs on demand, not as part of an upgrade.
#
# It checks /healthz, deliberately not /readyz. /healthz proves the process is
# serving; /readyz reaches Pub/Sub, GCS, and credential resolution, so a transient
# GCS blip would fail the test for reasons that have nothing to do with the
# release. The readiness probe already gates traffic on that — a release test
# should answer "did this release come up", not "is Google healthy right now".
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "family-media-bot.name" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "family-media-bot.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    # Kept after a failure so `kubectl logs` can explain why. Successful runs are
    # cleaned up so repeated tests do not accumulate pods.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: healthz
      image: curlimages/curl:8.11.1
      command: ["curl"]
      args:
        - "--fail"
        - "--silent"
        - "--show-error"
        - "--max-time"
        - "10"
        - "--retry"
        - "6"
        - "--retry-delay"
        - "5"
        - "--retry-connrefused"
        - "http://{{ include "family-media-bot.name" . }}-web:8080/healthz"
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
