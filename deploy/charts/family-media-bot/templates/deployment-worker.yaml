apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "family-media-bot.name" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "family-media-bot.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # One warm worker, deliberately. See values.yaml for the measurement behind it.
  replicas: {{ .Values.worker.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Surge before terminating, so a registry edit does not leave the queue
      # unattended. Pub/Sub distributes between the two overlapping workers
      # safely, and the outgoing pod's in-flight job is nacked on shutdown.
      #
      # This is why the node pool must be sized for two workers, not one: a
      # surge pod that cannot be scheduled leaves the rollout stuck and
      # --rollback-on-failure reverting a release that was actually fine.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "family-media-bot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        {{- include "family-media-bot.configChecksums" . | nindent 8 }}
      labels:
        {{- include "family-media-bot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "family-media-bot.name" . }}
      terminationGracePeriodSeconds: 120
      volumes:
        {{- include "family-media-bot.registryVolume" . | nindent 8 }}
      containers:
        - name: worker
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "family-media-bot.name" . }}-config
          volumeMounts:
            {{- include "family-media-bot.registryMount" . | nindent 12 }}
          env:
            - name: RUN_MODE
              value: worker
            - name: WORKER_CONCURRENCY
              value: {{ .Values.app.workerConcurrency | quote }}
            {{- include "family-media-bot.registryEnv" . | nindent 12 }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.telegramSecretName }}
                  key: TELEGRAM_BOT_TOKEN
          # /livez, not /healthz: the worker can serve HTTP perfectly while
          # consuming nothing, because the Pub/Sub stream can terminate
          # permanently and leave the pod Running and Ready forever. /livez
          # reports whether this process is actually attached to the queue.
          # failureThreshold 3 rides out a reconnect, which the adapter attempts
          # with backoff before the probe gives up and Kubernetes restarts us.
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
