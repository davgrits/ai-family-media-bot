apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "family-media-bot.name" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "family-media-bot.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # KEDA takes ownership immediately after creation. Starting at the configured
  # minimum prevents an unnecessary Spot node during the Helm install.
  replicas: {{ .Values.worker.minReplicaCount }}
  selector:
    matchLabels:
      {{- include "family-media-bot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "family-media-bot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "family-media-bot.name" . }}
      nodeSelector:
        {{- toYaml .Values.worker.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.worker.tolerations | nindent 8 }}
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "family-media-bot.name" . }}-config
          env:
            - name: RUN_MODE
              value: worker
            - name: WORKER_CONCURRENCY
              value: {{ .Values.app.workerConcurrency | quote }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.telegramSecretName }}
                  key: TELEGRAM_BOT_TOKEN
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
