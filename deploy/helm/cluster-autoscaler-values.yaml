autoDiscovery:
  clusterName: ai-family-media-bot

awsRegion: us-east-1

image:
  # Cluster-autoscaler minor version must match the cluster's (1.31).
  # The chart default (1.35.x) hangs at Initializing: its DRA informers
  # watch resource.k8s.io/v1, which does not exist on 1.31.
  tag: v1.31.5

rbac:
  serviceAccount:
    create: true
    # Must match the IRSA trust policy in infra/irsa.tf exactly;
    # the chart default (<release>-aws-cluster-autoscaler) would fail STS.
    name: cluster-autoscaler
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::684049557114:role/ai-family-media-bot-cluster-autoscaler

nodeSelector:
  role: web

extraArgs:
  balance-similar-node-groups: true
  skip-nodes-with-system-pods: false
  expander: least-waste
