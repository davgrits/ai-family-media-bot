# TEMPLATE ONLY — never commit a real token.
# The Telegram bot token is the single real application secret. Cloud access
# uses workload identity. Create the actual Secret imperatively so its value never
# touches the repo:
#
#   kubectl -n app create secret generic telegram-bot-token \
#     --from-literal=TELEGRAM_BOT_TOKEN='<token from @BotFather>'
#
# (Or apply a copy of this file with the placeholder filled in.)
apiVersion: v1
kind: Secret
metadata:
  name: telegram-bot-token
  namespace: app
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: "REPLACE_ME"
