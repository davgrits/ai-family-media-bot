# Legacy AWS manifest retained for history. Helm is the canonical deployment.
# Worker tier: consumes jobs from SQS, calls Bedrock, stores to S3, replies to
# Telegram. Scales 0 -> N on queue depth — KEDA (scaledobject.yaml) owns the
# replica count, cluster-autoscaler follows with Spot nodes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-media-bot-worker
  namespace: app
  labels:
    app: family-media-bot
    tier: worker
spec:
  # NO `replicas:` field, deliberately. KEDA's HPA owns the count (0..N);
  # if a number were set here, every `kubectl apply` would fight the
  # autoscaler and reset it.
  selector:
    matchLabels:
      app: family-media-bot
      tier: worker
  template:
    metadata:
      labels:
        app: family-media-bot
        tier: worker
    spec:
      serviceAccountName: family-media-bot
      nodeSelector:
        role: worker # the Spot 0->N node group (infra/aws/eks.tf)
      # The worker group is tainted workload=jobs:NoSchedule so nothing else
      # can pin a Spot node alive; this toleration is the matching key that
      # lets ONLY these pods in.
      tolerations:
        - key: workload
          operator: Equal
          value: jobs
          effect: NoSchedule
      # Give an in-flight job time to finish on scale-down/eviction: jobs take
      # ~15-60s, so 120s covers the worst case. If the pod dies anyway (Spot
      # reclaim), SQS redelivers after the 300s visibility timeout — at-least-
      # once by design, so nothing is lost either way.
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: family-media-bot
          ports:
            - name: http
              containerPort: 8080 # worker also serves /healthz /readyz /metrics
          envFrom:
            - configMapRef:
                name: family-media-bot-config
          env:
            - name: RUN_MODE
              value: "worker" # consume-only: no poller, no webhook handling
            # Workers reply to the chat directly (sendMessage/sendPhoto via
            # the NAT), so they need the token too. TELEGRAM_POLLING stays
            # false (default) — only the web tier may poll.
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-bot-token
                  key: TELEGRAM_BOT_TOKEN
            - name: WORKER_CONCURRENCY
              value: "1" # one job at a time per pod; scale OUT, not up
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            # The heavy lifting (generation) happens inside Bedrock — the pod
            # itself mostly waits on network. Requests sized so several pods
            # bin-pack onto one t3.medium Spot node before the autoscaler has
            # to add another.
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
