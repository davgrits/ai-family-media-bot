# Legacy AWS manifest retained for history. Helm is the canonical deployment.
# Non-secret configuration shared by both tiers (envFrom in the Deployments).
# These are the "flip the env vars" from the README: the same image runs with
# fakes on a laptop and against real AWS here. Values come from terraform
# outputs (queue URL, bucket). Per-tier settings (RUN_MODE, TELEGRAM_POLLING)
# are NOT here — they differ between web and worker and live in each
# Deployment. The Telegram token is a Secret, never a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: family-media-bot-config
  namespace: app
data:
  # Swap points: real adapters for every port.
  QUEUE: "sqs"
  STORY_PROVIDER: "bedrock"
  IMAGE_PROVIDER: "bedrock"
  STORAGE: "s3"

  # AWS wiring (terraform outputs: jobs_queue_url, media_bucket_name).
  AWS_REGION: "us-east-1"
  SQS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/684049557114/ai-family-media-bot-jobs"
  S3_BUCKET: "ai-family-media-bot-media-684049557114"

  # Models. Text: Claude Haiku via a us.* cross-region inference profile.
  # Image: Nova Canvas is lifecycle-Legacy (blocked for this account), so the
  # active Stability model is used — us-west-2 only, hence the extra region.
  # NOTE: infra/aws/irsa.tf grants InvokeModel for the configured
  # image model (nova-canvas, us-east-1) — it must be updated to the Stability
  # ARN in us-west-2 before in-cluster image generation will authorize.
  BEDROCK_TEXT_MODEL_ID: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
  BEDROCK_IMAGE_MODEL_ID: "stability.stable-image-core-v1:1"
  BEDROCK_IMAGE_REGION: "us-west-2"

  # Structured JSON logs for CloudWatch / any collector.
  LOG_FORMAT: "json"
  LOG_LEVEL: "INFO"
