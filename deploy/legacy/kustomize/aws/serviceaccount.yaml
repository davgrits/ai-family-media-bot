# Legacy AWS manifest retained for history. Helm is the canonical deployment.
# The pods' AWS identity. The annotation is the entire IRSA handshake on the
# k8s side: EKS's pod identity webhook sees it, injects a projected OIDC token
# plus AWS_ROLE_ARN/AWS_WEB_IDENTITY_TOKEN_FILE env vars into every pod using
# this service account, and boto3 exchanges the token via STS at call time.
# No access keys anywhere — the namespace:name pair must exactly match the
# trust policy in infra/aws/irsa.tf.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: family-media-bot
  namespace: app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::684049557114:role/ai-family-media-bot-app
