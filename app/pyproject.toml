[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "family-media-bot"
version = "0.1.0"
description = "AI family-media Telegram bot — bedtime story + illustration, GCP behind interfaces."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "prometheus-client>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "opentelemetry-sdk>=1.24,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24,<2.0",
    "google-cloud-pubsub>=2.21,<3.0",
    "google-cloud-storage>=2.16,<4.0",
    "google-genai>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
family-media-bot = "family_media_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["family_media_bot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff's default selection is E4, E7, E9, F — which omits E501, so the
# line-length above was decorative until this list existed. E/W give the full
# pycodestyle set, F is pyflakes, I is import ordering.
#
# B and UP are deliberately not selected: B027 flags QueuePort.start/close, which
# are intentionally empty optional lifecycle hooks rather than abstract methods.
select = ["E", "W", "F", "I"]
